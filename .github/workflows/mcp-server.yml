name: MCP Server Checks

on:
  push:
    branches:
      - main
      - "feat/switchfilehub-mcp-server"
    paths:
      - "mcp-server/**"
      - ".github/workflows/mcp-server.yml"
  pull_request:
    paths:
      - "mcp-server/**"
      - ".github/workflows/mcp-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-server/package.json
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
