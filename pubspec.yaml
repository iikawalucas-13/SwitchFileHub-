name: switch_file_hub
description: Gerenciador de arquivos para Nintendo Switch (FTPD), Windows 11 e Android via rede local.
publish_to: 'none'
version: 1.0.0+4
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.0.0
  desktop_drop: ^0.5.0
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
